# The main pipeline for online_retail

resources:
  pipelines:
    online_retail_etl:
      name: online_retail_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/online_retail_etl"

      libraries:
        - glob:
            include: ../src/online_retail_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
